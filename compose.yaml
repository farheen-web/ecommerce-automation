
services:
  selenium-chrome:
    image: selenium/standalone-chrome:4.51.0
    ports:
      - "4445:4444"
      - "7901:7900"
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      selenium-chrome:
        condition: service_healthy
    environment:
      BROWSER: remote
      GRID_URL: http://selenium-chrome:4444
    volumes:
      - ./test-output:/app/test-output
   
